<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202b3a">
  <meta name="description" content="Demos graphing calculator. Explore expressions, symbolic mathematics, and interactive 2D and 3D graphs in your browser.">
  <title>Demos · Graphing calculator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232d70da'/%3E%3Cpath d='M10 42Q24-12 34 32T54 20' fill='none' stroke='white' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./vendor/katex.css">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./vendor/plotly.js"></script>
  <script defer src="./vendor/katex.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Demos home"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M3 26Q12-8 19 18T33 12"/></svg><span>Demos</span></a>
    <input id="title" aria-label="Graph title" value="Untitled Graph" maxlength="200">
    <span id="save-state" class="save-state">Saved on this device</span>
    <button id="save" class="header-button">Save</button>
    <button id="library" class="header-button">Library</button>
    <button id="menu" class="header-button" aria-label="Open graph menu" aria-haspopup="dialog">☰</button>
  </header>
  <main id="workspace" data-layout="split">
    <section class="worksheet" aria-label="Math worksheet">
      <nav class="worksheet-toolbar" aria-label="Worksheet controls">
        <button id="add" class="primary">＋ Expression</button>
        <button id="add-table">Table</button>
        <button id="add-note">Note</button>
        <span class="spacer"></span>
        <button id="undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>↶</button>
        <button id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled>↷</button>
      </nav>
      <div id="rows" class="rows"></div>
      <div class="worksheet-footer"><span id="engine-state" role="status">Starting calculator…</span><button id="keyboard-toggle" aria-pressed="false">Keypad</button></div>
      <section id="keypad" class="keypad" aria-label="Math keypad" hidden></section>
    </section>
    <section class="graph-panel" aria-label="Interactive graph">
      <div id="plot"></div>
      <div class="graph-toolbar">
        <div class="segmented" aria-label="Graph dimension"><button id="mode-2d" class="selected" aria-pressed="true">2D</button><button id="mode-3d" aria-pressed="false">3D</button></div>
        <button id="angle" title="Toggle radians / degrees">RAD</button>
        <span class="spacer"></span>
        <button id="home" title="Reset graph view" aria-label="Reset graph view">⌂</button>
        <button id="settings" title="Graph settings" aria-label="Graph settings">⚙</button>
      </div>
      <div id="graph-hint" class="graph-hint">Drag to pan · Scroll to zoom · Click a curve to inspect</div>
      <div id="graph-error" class="graph-error" role="status" hidden></div>
    </section>
  </main>
  <footer class="bottom-bar"><span>GRAPHING CALCULATOR</span><div class="segmented" aria-label="Workspace layout"><button data-layout="split" class="selected">Split</button><button data-layout="graph">Graph</button><button data-layout="calculator">Calculator</button></div><button id="help">Help &amp; examples</button></footer>
  <dialog id="dialog"><div class="dialog-header"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="Close dialog">✕</button></div><div id="dialog-body"></div></dialog>
  <input id="file-input" type="file" accept=".json,.csv,.tsv,text/csv,text/tab-separated-values,application/json" hidden>
  <div id="toast" role="status" hidden></div>
  <noscript>This calculator needs JavaScript enabled in your browser.</noscript>
  <script type="module" src="./src/app.mjs"></script>
</body>
</html>
