name: Android APK release

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out commit
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" >&2; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/demos-release.jks"
          test -s "$RUNNER_TEMP/demos-release.jks"

      - name: Build signed universal APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/demos-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'demos-release' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION_CODE=$((1000 + ${{ github.run_number }}))
          ./gradlew --no-daemon assembleRelease -PversionCode="$VERSION_CODE"
          apk="$(find app/build/outputs/apk/release -type f -iname '*universal*.apk' -print -quit)"
          test -n "$apk" || { echo "Universal APK was not produced" >&2; exit 1; }
          cp "$apk" "$RUNNER_TEMP/Demos-universal.apk"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (${{ github.sha }})
          target_commitish: ${{ github.sha }}
          files: ${{ runner.temp }}/Demos-universal.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
