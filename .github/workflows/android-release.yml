name: APK and EXE release

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out commit
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build signed universal APK
        run: |
          chmod +x gradlew
          VERSION_CODE=$((1000 + ${{ github.run_number }}))
          ./gradlew --no-daemon :app:assembleRelease -PuniversalApkOnly=true -PversionCode="$VERSION_CODE"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Demos-universal.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Demos-universal-apk
          path: ${{ runner.temp }}/Demos-universal.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out commit
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore Windows Giac DLL
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: desktop/build/native-dist
          key: giac-${{ runner.os }}-${{ runner.arch }}-clang64-v1-${{ hashFiles('third_party/giac/giac-70507-source.zip', '.github/workflows/android-release.yml') }}

      - name: Set up MSYS2 and the Windows Giac toolchain
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            base-devel
            mingw-w64-clang-x86_64-cc
            mingw-w64-clang-x86_64-gmp
            mingw-w64-clang-x86_64-mpfr
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-make

      - name: Build the Windows Giac JNI library
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          unzip third_party/giac/giac-70507-source.zip -d "$RUNNER_TEMP/giac"
          source_dir="$RUNNER_TEMP/giac/giac-19a710aea9d528afa272ea582f3283f242e17af3"
          export MSYSTEM=CLANG64
          export CC=clang CXX=clang++
          cmake -S "$source_dir" -B "$RUNNER_TEMP/giac-build" -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/giac-build" --target javagiac --parallel "$(nproc)"
          mkdir -p desktop/build/native-dist
          cp "$RUNNER_TEMP/giac-build/libjavagiac.dll" desktop/build/native-dist/javagiac.dll

      - name: Cache Windows Giac DLL
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: desktop/build/native-dist
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Build the Windows installer
        shell: pwsh
        run: |
          $versionCode = 1000 + [int]$env:GITHUB_RUN_NUMBER
          .\gradlew.bat --no-daemon :desktop:packageExe "-PversionCode=$versionCode"

      - name: Verify the native library installed by the EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem desktop/build/compose/binaries/main/exe -Filter *.exe -File)
          if ($installers.Count -ne 1) { throw 'Exactly one Windows EXE installer must be produced.' }
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList '/quiet', '/norestart' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "EXE installation failed ($($process.ExitCode))." }
          $dll = Join-Path $env:ProgramFiles 'Demos/app/resources/native/javagiac.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
            throw 'The EXE did not install app/resources/native/javagiac.dll. Do not publish this installer.'
          }
          $expected = (Get-FileHash -LiteralPath desktop/build/native-dist/javagiac.dll -Algorithm SHA256).Hash
          $actual = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'The EXE installed a stale or different Giac DLL.' }

      - name: Collect EXE installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem desktop/build/compose/binaries/main/exe -Filter *.exe -File | Select-Object -First 1
          if (-not $installer) { throw 'The Windows EXE was not produced.' }
          Copy-Item -LiteralPath $installer.FullName -Destination "$env:RUNNER_TEMP/Demos-setup.exe"

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Demos-Windows
          path: ${{ runner.temp }}/Demos-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-release:
    needs: [build-and-release, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish APK and Windows installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (${{ github.sha }})
          target_commitish: ${{ github.sha }}
          body: |
            Downloads: **Demos-setup.exe** (Windows installer) and **Demos-universal.apk** (Android).

            [Complete source for this build, including bundled native dependency sources](https://github.com/${{ github.repository }}/tree/${{ github.sha }}).
          files: |
            release-artifacts/Demos-universal-apk/Demos-universal.apk
            release-artifacts/Demos-Windows/Demos-setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true

